# Builds the Next.js app and commits the static export to /docs so GitHub Pages
# can serve it from "Deploy from a branch → main → /docs" (fixes README showing on the domain).
name: Deploy site to docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-and-sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install and build
        working-directory: portfolio
        run: |
          npm ci
          npm run build

      - name: Sync export to docs/
        run: |
          mkdir -p docs
          rsync -a --delete portfolio/out/ docs/

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes under docs/"
            exit 0
          fi
          git commit -m "chore(pages): sync Next.js export to docs/"
          git push
